<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Islam Kassem</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap">
    <style>
        .error-container {
            text-align: center;
            padding: 50px 20px;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInUp 0.6s ease-out;
            background: var(--section-bg);
            border-radius: 12px;
            box-shadow: var(--surface-shadow);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all var(--transition-speed) var(--transition-timing);
        }

        .error-container:hover {
            box-shadow: var(--surface-shadow-hover);
            border-color: var(--accent-color);
            background: var(--card-hover-bg);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-size: 8em;
            background: linear-gradient(135deg, var(--accent-color), var(--skill-border));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
            position: relative;
            font-family: 'Cinzel', serif;
        }

        .error-code::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            border-radius: 2px;
        }

        .error-message {
            font-size: 1.5em;
            margin: 20px 0;
            color: var(--text-color);
            font-family: 'Cinzel', serif;
        }

        .error-description {
            color: var(--text-color);
            opacity: 0.8;
            margin: 15px 0;
            line-height: 1.6;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-color) 30%, var(--skill-border) 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all var(--transition-speed) var(--transition-timing);
            font-weight: bold;
            font-family: 'Cinzel', serif;
        }

        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(61, 220, 132, 0.3);
        }

        .home-link i {
            transition: transform 0.3s ease;
        }

        .home-link:hover i {
            transform: translateX(-3px);
        }

        .suggested-links {
            margin-top: 40px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--surface-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            transition: all var(--transition-speed) var(--transition-timing);
        }

        .suggested-links:hover {
            box-shadow: var(--surface-shadow-hover);
            border-color: var(--accent-color);
            background: var(--card-hover-bg);
        }

        .suggested-links h2 {
            color: var(--accent-color);
            font-size: 1.3em;
            margin-bottom: 15px;
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, var(--accent-color), var(--skill-border));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .suggested-links ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .suggested-links a {
            color: var(--text-color);
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            background: var(--section-bg);
            border: 1px solid var(--border-color);
            transition: all var(--transition-speed) var(--transition-timing);
            font-family: 'Cinzel', serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .suggested-links a::before {
            content: '▹';
            color: var(--accent-color);
        }

        .suggested-links a:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px) translateX(5px);
            box-shadow: var(--surface-shadow);
            background: var(--card-hover-bg);
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6em;
            }
            
            .error-message {
                font-size: 1.3em;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 4em;
            }
            
            .error-message {
                font-size: 1.1em;
            }

            .suggested-links ul {
                flex-direction: column;
                align-items: stretch;
            }

            .suggested-links a {
                padding: 10px 16px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .suggested-links a {
                padding: 14px 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Islam Kassem</h1>
            <button id="theme-toggle" aria-label="Toggle Dark Mode">
                <i class="fas fa-sun"></i>
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>
    <main>
        <br>
        <section class="error-container">
            <h1 class="error-code">404</h1>
            <p class="error-message">Oops! The page you're looking for doesn't exist.</p>
            <p class="error-description">The page might have been moved, deleted, or never existed. Let's get you back on track!</p>
            <a href="/" class="home-link">
                <i class="fas fa-chevron-left"></i>
                Back to Home
            </a>
            <div class="suggested-links">
                <h2>You might be interested in:</h2>
                <ul>
                    <li><a href="/#services">AI Services</a></li>
                    <li><a href="/#about-me">About Me</a></li>
                    <li><a href="/#projects">Projects</a></li>
                    <li><a href="/#skills">Skills & Expertise</a></li>
                </ul>
            </div>
        </section>
    </main>
    <footer>
        <div class="container footer-content">
            <p>&copy; <script>document.write(new Date().getFullYear());</script> Islam Kassem | @elcaiseri</p>
            <div class="footer-icons">
                <a href="mailto:kassem@elcaiseri.com" title="Email Me" aria-label="Send email"><i class="fas fa-envelope"></i></a>
                <a href="https://www.linkedin.com/in/elcaiseri" title="LinkedIn Profile" target="_blank" rel="noopener" aria-label="Visit LinkedIn Profile"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/elcaiseri" title="GitHub Profile" target="_blank" rel="noopener" aria-label="Visit GitHub Profile"><i class="fab fa-github"></i></a>
                <a href="https://elcaiseri.medium.com" title="Medium Blog" target="_blank" rel="noopener" aria-label="Read My Blog on Medium"><i class="fab fa-medium"></i></a>
                <a href="https://www.kaggle.com/elcaiseri" title="Kaggle Profile" target="_blank" rel="noopener" aria-label="Visit Kaggle Profile"><i class="fab fa-kaggle"></i></a>
            </div>
        </div>
    </footer>
    <script src="scripts/script.js"></script>
</body>
</html>
